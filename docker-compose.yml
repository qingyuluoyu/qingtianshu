services:
  qingshu-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      QINGSHU_DATA_DIR: /data
      BACKGROUND_JOBS_ENABLED: "true"
      BACKGROUND_MARKET_REFRESH_SECONDS: "30"
      BACKGROUND_ARTICLE_CHECK_SECONDS: "1800"
      BACKGROUND_INFO_REFRESH_SECONDS: "600"
      BACKGROUND_USE_HERMES: "false"
      HERMES_ENABLED: "false"
      TUSHARE_ENABLED: "${TUSHARE_ENABLED:-false}"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN:-}"
      TUSHARE_API_URL: "${TUSHARE_API_URL:-https://teajoin.com}"
      SEC_USER_AGENT: "${SEC_USER_AGENT:-QingshuFinancialResearch/0.1 research@example.com}"
      DEFAULT_A_SHARE_SYMBOLS: "${DEFAULT_A_SHARE_SYMBOLS:-000063.SZ,300308.SZ}"
      DEFAULT_RESEARCH_SYMBOLS: "${DEFAULT_RESEARCH_SYMBOLS:-000063.SZ,300308.SZ,NVDA}"
    volumes:
      - qingshu-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  qingshu-data:
